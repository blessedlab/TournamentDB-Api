<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS:GO 2v2 School Tournament</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <div class="brand">CS:GO 2v2 AIM TOURNAMENT WIŚNIOWA</div>
    </header>

    <main class="registration">
        <div class="form-container">
            <h2>TEAM REGISTRATION</h2>
            <form id="tournamentForm" novalidate>
                <div class="form-group">
                    <label for="teamName">TEAM NAME</label>
                    <input type="text" id="teamName" required placeholder="Enter your team name">
                    <p class="error-message"></p>
                </div>

                <div class="players-container">
                    <div class="player-box">
                        <h3>PLAYER 1</h3>
                        <div class="form-group">
                            <label for="p1Nickname">NICKNAME</label>
                            <input type="text" id="p1Nickname" required placeholder="Player 1 Nickname">
                            <p class="error-message"></p>
                        </div>
                        <div class="form-group">
                            <label for="p1Email">EMAIL ADDRESS</label>
                            <input type="email" id="p1Email" required placeholder="example@tm1.edu.pl" pattern=".+@tm1\.edu\.pl$">
                            <p class="error-message"></p>
                        </div>
                    </div>

                    <div class="player-box">
                        <h3>PLAYER 2</h3>
                        <div class="form-group">
                            <label for="p2Nickname">NICKNAME</label>
                            <input type="text" id="p2Nickname" required placeholder="Player 2 Nickname">
                            <p class="error-message"></p>
                        </div>
                        <div class="form-group">
                            <label for="p2Email">EMAIL ADDRESS</label>
                            <input type="email" id="p2Email" required placeholder="example@tm1.edu.pl" pattern=".+@tm1\.edu\.pl$">
                            <p class="error-message"></p>
                        </div>
                    </div>
                </div>

                <div id="formMessage" class="form-message"></div>
                <button type="submit" class="submit-button">SUBMIT REGISTRATION</button>
            </form>
        </div>

        <footer class="tournament-info">
            <div class="info-main">
                <span>DATE: APRIL 9TH</span>
                <span class="divider">|</span>
                <span>LOCATION: WIŚNIOWA 56, WARSZAWA</span>
            </div>
            <div class="info-warning">
                RECOMMENDATION: BRING YOUR OWN DEVICES (MOUSE, KEYBOARD, HEADSET).
            </div>
        </footer>
    </main>

    <script src="http://localhost/TournamentDB-Api/index.js"></script>
</body>
</html>
